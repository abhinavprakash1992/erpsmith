[project]
name = "erpsmith"
authors = [{ name = "Abhinav Prakash", email = "abhinav.prakash1992@gmail.com" }]
description = "ERPNext developer copilot over MCP: build, debug and fix customizations behind a plan gate, with semantic memory"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
