[project]
name = "erpsmith"
authors = [{ name = "Abhinav Prakash", email = "abhinav.prakash1992@gmail.com" }]
description = "Developer copilot for ERPNext over MCP: build, debug and fix customizations behind a plan gate, with semantic memory"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["license.txt"]
keywords = ["frappe", "erpnext", "mcp", "ai"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dynamic = ["version"]
dependencies = [
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://erpsmith.vercel.app"
Documentation = "https://erpsmith.vercel.app/docs"
Source = "https://github.com/abhinavprakash1992/erpsmith"
Issues = "https://github.com/abhinavprakash1992/erpsmith/issues"
Changelog = "https://github.com/abhinavprakash1992/erpsmith/blob/main/CHANGELOG.md"

[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
